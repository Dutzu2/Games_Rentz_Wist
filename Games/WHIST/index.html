<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whist - Joc de cărți</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Whist Românesc</h1>
    <div id="playersList"></div>
    <input type="text" id="newPlayerName" placeholder="Nume jucător" />
    <button id="addPlayerBtn">Adaugă jucător</button>
    <div id="playersCheckboxes"></div>
    <button id="createGameBtn">Creează joc</button>
    <div id="activeGame"></div>
    <div id="history"></div>
    <button id="loadLastGameBtn">Încarcă ultimul joc</button>
    <button id="endGameBtn">Finalizează jocul</button>
    <button id="exportBtn">Exportă date</button>
    <button id="importBtn">Importă date</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
