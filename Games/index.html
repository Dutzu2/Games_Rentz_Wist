<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meniu Jocuri</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #f5f7fa; color: #222; }
    .wrap { max-width: 900px; margin: 40px auto; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p.muted { color: #666; margin: 0 0 18px; }
    .grid { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { flex: 1 1 240px; background: #fff; border: 1px solid #e1e6eb; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 140px; box-shadow: 0 2px 6px rgba(10, 20, 30, 0.04); }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .card p { margin: 0 0 12px; color: #444; }
    .btn { display: inline-block; padding: 10px 14px; border-radius: 6px; border: none; background: #1976d2; color: #fff; text-decoration: none; cursor: pointer; }
    .btn.secondary { background: #4caf50; }
    .hint { margin-top: 12px; color: #666; font-size: 13px; }
    footer { margin-top: 30px; color: #888; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Meniu Jocuri</h1>
    <p class="muted">Alege jocul pe care vrei să-l joci. Pagina te va redirecționa în folderul corespunzător.</p>

    <div class="grid">
      <div class="card" id="card-rentz">
        <div>
          <h2>Rentz</h2>
          <p>Deschide interfața Rentz (folder: RENTZ).</p>
        </div>
        <div>
          <a class="btn" id="openRentz" href="./RENTZ/index.html">Deschide Rentz</a>
        </div>
      </div>

      <div class="card" id="card-wist">
        <div>
          <h2>Whist</h2>
          <p>Deschide interfața Whist (folder: WHIST).</p>
        </div>
        <div>
          <a class="btn secondary" id="openWist" href="./WHIST/index.html">Deschide Whist</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('openRentz').addEventListener('click', function(e) {
      // lasă comportamentul normal — link relativ la folderul Games
    });
    document.getElementById('openWist').addEventListener('click', function(e) {
      // lasă comportamentul normal
    });
  </script>
</body>
</html>
